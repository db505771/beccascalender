<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playtime Calendar</title>
  <style>
    body {
      background-color: #0f1a2b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      touch-action: pan-y;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 500px;
      transition: transform 0.3s ease;
    }

    .day {
      width: 60px;
      height: 60px;
      background-color: #1a2b3d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .day.played {
      background-color: #1e824c;
    }

    .day.today {
      border: 2px solid #00aced;
    }

    .day span {
      font-size: 20px;
    }

    .loading-status {
      text-align: center;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1 id="calendar-title">Loading...</h1>
  <div class="calendar" id="calendar"></div>
  <div id="status" class="loading-status">Fetching timeline data...</div>

  <script>
    const gameApi = "https://script.google.com/macros/s/AKfycbzcX9WsRdeEdz1ziWq4CbuUwa_WwxxUGPI1YtMTvYIHZGZ4cBus_p7qXdIIiFW_0hu_/exec";

    let gameData = [];
    let currentDate = new Date();

    // ⚡ 1. Single API request pipeline
    async function initDashboard() {
      try {
        const res = await fetch(gameApi);
        gameData = await res.json();
        
        document.getElementById("status").style.display = "none";
        buildCalendar();
      } catch (err) {
        console.error(err);
        document.getElementById("status").innerText = "Failed to synchronize calendar logs.";
      }
    }

    function getMonthDays(year, month) {
      const date = new Date(year, month, 1);
      const days = [];
      while (date.getMonth() === month) {
        days.push(new Date(date));
        date.setDate(date.getDate() + 1);
      }
      return days;
    }

    // ⚡ 2. Instant local render cycle
    function buildCalendar() {
      const calendar = document.getElementById("calendar");
      const title = document.getElementById("calendar-title");
      calendar.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const today = new Date();
      const isCurrentMonth = (month === today.getMonth() && year === today.getFullYear());
      const monthName = currentDate.toLocaleString("default", { month: "long" });
      title.textContent = `${monthName} ${year} Play Calendar`;

      const playedDates = new Set();

      // Scrape data locally out of your optimized Web App payload
      for (const game of gameData) {
        const date = new Date(game.date);
        if (date.getFullYear() === year && date.getMonth() === month && game.minutes > 0) {
          playedDates.add(date.getDate());
        }
      }

      const days = getMonthDays(year, month);
      let htmlBuffer = "";

      for (const day of days) {
        const dayNum = day.getDate();
        let classes = "day";
        
        if (playedDates.has(dayNum)) classes += " played";
        if (isCurrentMonth && dayNum === today.getDate()) classes += " today";

        // Build HTML string efficiently
        htmlBuffer += `<div class="${classes}" onclick="showGames(new Date(${year}, ${month}, ${dayNum}))">${dayNum}<span></span></div>`;
      }
      
      calendar.innerHTML = htmlBuffer;
    }

    // Swipe handling
    let touchStartX = 0;

    document.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      handleSwipe(touchStartX, touchEndX);
    });

    document.addEventListener("mousedown", (e) => {
      touchStartX = e.clientX;
    });

    document.addEventListener("mouseup", (e) => {
      const touchEndX = e.clientX;
      handleSwipe(touchStartX, touchEndX);
    });

    function handleSwipe(startX, endX) {
      const diff = startX - endX;
      if (diff > 60) {
        currentDate.setMonth(currentDate.getMonth() + 1);
        buildCalendar();
      } else if (diff < -60) {
        currentDate.setMonth(currentDate.getMonth() - 1);
        buildCalendar();
      }
    }

    function showGames(day) {
      const existing = document.getElementById("popup");
      if (existing) {
        existing.remove();
        return;
      }

      const popup = document.createElement("div");
      popup.id = "popup";
      popup.style.position = "fixed";
      popup.style.inset = "0";
      popup.style.background = "rgba(0,0,0,0.8)";
      popup.style.display = "flex";
      popup.style.justifyContent = "center";
      popup.style.alignItems = "center";
      popup.style.zIndex = "999";

      const box = document.createElement("div");
      box.style.background = "#1a2b3d";
      box.style.padding = "20px";
      box.style.borderRadius = "12px";
      box.style.width = "90%";
      box.style.maxWidth = "400px";
      box.style.maxHeight = "70vh";
      box.style.overflowY = "auto";
      
      // Stop modal from closing accidentally when tapping interior cards
      box.onclick = (e) => e.stopPropagation();

      const title = document.createElement("h2");
      title.style.marginTop = "0";
      title.innerText = day.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      box.appendChild(title);

      const filtered = gameData.filter(g => {
        const d = new Date(g.date);
        return (
          d.getDate() === day.getDate() &&
          d.getMonth() === day.getMonth() &&
          d.getFullYear() === day.getFullYear()
        );
      });

      if (filtered.length === 0) {
        const none = document.createElement("div");
        none.style.color = "#aaa";
        none.innerText = "No gaming activity logged on this date.";
        box.appendChild(none);
      } else {
        filtered.forEach(g => {
          const card = document.createElement("div");
          card.style.display = "flex";
          card.style.alignItems = "center";
          card.style.gap = "12px";
          card.style.marginBottom = "12px";
          card.style.background = "#24384f";
          card.style.padding = "10px";
          card.style.borderRadius = "10px";

          card.innerHTML = `
            <img
              src="${g.image || ''}"
              alt=""
              style="
                width:60px;
                height:60px;
                border-radius:10px;
                object-fit:cover;
                background:#111;
              "
            >
            <div>
              <div style="font-weight:bold; line-height:1.3;">
                ${g.name}
              </div>
              <div style="color:#ccc; font-size:14px; margin-top: 4px;">
                ${Math.floor(g.minutes / 60)}h ${g.minutes % 60}m played
              </div>
            </div>
          `;
          box.appendChild(card);
        });
      }

      popup.appendChild(box);
      popup.onclick = () => popup.remove();
      document.body.appendChild(popup);
    }

    // Initialize application execution
    initDashboard();
  </script>
</body>
</html>
