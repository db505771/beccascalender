<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playtime Calendar</title>
  <style>
    body {
      background-color: #0f1a2b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      touch-action: pan-y;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr); /* Fixed to standard 7 days a week layout */
      gap: 10px;
      max-width: 500px;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .day {
      aspect-ratio: 1; /* Keeps cells square across multiple devices */
      background-color: #1a2b3d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .day.played {
      background-color: #1e824c;
    }

    .day.today {
      border: 2px solid #00aced;
    }

    .day span {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1 id="calendar-title">Loading...</h1>
  <div class="calendar" id="calendar"></div>

  <script>
    const gameApi = "https://script.google.com/macros/s/AKfycbzcX9WsRdeEdz1ziWq4CbuUwa_WwxxUGPI1YtMTvYIHZGZ4cBus_p7qXdIIiFW_0hu_/exec";

    let gameData = [];
    let currentDate = new Date();

    // ⚡ 1. Fetch data EXACTLY ONCE on initial boot
    async function init() {
      try {
        const res = await fetch(gameApi);
        gameData = await res.json();
      } catch(e) {
        console.error("Failed to fetch game data", e);
      }
      buildCalendar();
    }

    function getMonthDays(year, month) {
      const date = new Date(year, month, 1);
      const days = [];
      while (date.getMonth() === month) {
        days.push(new Date(date));
        date.setDate(date.getDate() + 1);
      }
      return days;
    }

    // ⚡ 2. Instant purely visual rendering engine
    function buildCalendar() {
      const calendar = document.getElementById("calendar");
      const title = document.getElementById("calendar-title");
      calendar.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const today = new Date();
      const isCurrentMonth = (month === today.getMonth() && year === today.getFullYear());
      const monthName = currentDate.toLocaleString("default", { month: "long" });
      title.textContent = `${monthName} ${year} Play Calendar`;

      // Build quick set using pre-fetched memory data
      const playedDates = new Set();
      gameData.forEach(g => {
        const date = new Date(g.date);
        if (date.getFullYear() === year && date.getMonth() === month && g.minutes > 0) {
          playedDates.add(date.getDate());
        }
      });

      const days = getMonthDays(year, month);

      // Create fragment for high speed performance batch injection
      const fragment = document.createDocumentFragment();

      days.forEach(day => {
        const div = document.createElement("div");
        div.classList.add("day");
        div.innerHTML = `${day.getDate()}<span></span>`;

        if (playedDates.has(day.getDate())) {
          div.classList.add("played");
        }

        if (isCurrentMonth && day.getDate() === today.getDate()) {
          div.classList.add("today");
        }

        div.onclick = () => showGames(day);
        fragment.appendChild(div);
      });

      calendar.appendChild(fragment);
    }

    // Swipe handling
    let touchStartX = 0;

    document.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    });

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      handleSwipe(touchStartX, touchEndX);
    });

    document.addEventListener("mousedown", (e) => {
      touchStartX = e.clientX;
    });

    document.addEventListener("mouseup", (e) => {
      const touchEndX = e.clientX;
      handleSwipe(touchStartX, touchEndX);
    });

    function handleSwipe(startX, endX) {
      const diff = startX - endX;
      if (diff > 50) {
        currentDate.setMonth(currentDate.getMonth() + 1);
        buildCalendar();
      } else if (diff < -50) {
        currentDate.setMonth(currentDate.getMonth() - 1);
        buildCalendar();
      }
    }

    function showGames(day){
      const existing = document.getElementById("popup");
      if(existing) existing.remove();

      const popup = document.createElement("div");
      popup.id = "popup";
      popup.style.position = "fixed";
      popup.style.inset = "0";
      popup.style.background = "rgba(0,0,0,0.7)";
      popup.style.display = "flex";
      popup.style.justifyContent = "center";
      popup.style.alignItems = "center";
      popup.style.zIndex = "999";

      const box = document.createElement("div");
      box.style.background = "#1a2b3d";
      box.style.padding = "20px";
      box.style.borderRadius = "12px";
      box.style.width = "90%";
      box.style.maxWidth = "400px";
      box.style.maxHeight = "70vh";
      box.style.overflowY = "auto";
      
      // Stop clicks inside the window box from closing the pop-up
      box.onclick = (e) => e.stopPropagation();

      const title = document.createElement("h2");
      title.innerText = day.toLocaleDateString();
      box.appendChild(title);

      const filtered = gameData.filter(g => {
        const d = new Date(g.date);
        return (
          d.getDate() === day.getDate() &&
          d.getMonth() === day.getMonth() &&
          d.getFullYear() === day.getFullYear()
        );
      });

      if(filtered.length === 0){
        const none = document.createElement("div");
        none.innerText = "No games found.";
        box.appendChild(none);
      } else {
        filtered.forEach(g => {
          const card = document.createElement("div");
          card.style.display = "flex";
          card.style.alignItems = "center";
          card.style.gap = "10px";
          card.style.marginBottom = "12px";
          card.style.background = "#24384f";
          card.style.padding = "10px";
          card.style.borderRadius = "10px";

          card.innerHTML = `
            <img
              src="${g.image || ''}"
              style="
                width:60px;
                height:60px;
                border-radius:10px;
                object-fit:cover;
              "
              alt=""
            >
            <div>
              <div style="font-weight:bold;">${g.name}</div>
              <div style="color:#ccc;font-size:14px;">
                ${Math.floor(g.minutes/60)}h ${g.minutes%60}m played
              </div>
            </div>
          `;
          box.appendChild(card);
        });
      }

      popup.appendChild(box);
      popup.onclick = () => popup.remove();
      document.body.appendChild(popup);
    }

    // Kickstart program
    init();
  </script>
</body>
</html>
